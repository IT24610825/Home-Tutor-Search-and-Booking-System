<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration - Tutor Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-6">
                <div class="admin-form animate-fade-in-up">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                        <h2 class="mt-3">Admin Registration</h2>
                        <p class="text-muted">Create your admin account to manage the system</p>
                    </div>

                    <form id="adminRegistrationForm" onsubmit="return registerAdmin(event)">
                        <div class="form-group">
                            <label class="form-label" for="fullName">
                                <i class="bi bi-person me-2"></i>Full Name
                            </label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="email">
                                <i class="bi bi-envelope me-2"></i>Email Address
                            </label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="username">
                                <i class="bi bi-person-badge me-2"></i>Username
                            </label>
                            <input type="text" class="form-control" id="username" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="password">
                                <i class="bi bi-key me-2"></i>Password
                            </label>
                            <input type="password" class="form-control" id="password" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="confirmPassword">
                                <i class="bi bi-key-fill me-2"></i>Confirm Password
                            </label>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="adminRole">
                                <i class="bi bi-person-workspace me-2"></i>Admin Role
                            </label>
                            <select class="form-control" id="adminRole" required>
                                <option value="SUPER_ADMIN">Super Admin</option>
                                <option value="SYSTEM_ADMIN">System Admin</option>
                                <option value="CONTENT_ADMIN">Content Admin</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-4">
                            <i class="bi bi-person-plus me-2"></i>Register Admin Account
                        </button>

                        <div class="text-center mt-4">
                            <a href="admin-login.html" class="text-decoration-none">
                                Already have an account? Login here
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>

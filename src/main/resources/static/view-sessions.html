<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Sessions - Tutor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/sessions.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="tutor-dashboard.html">Tutor Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="view-sessions.html">View Sessions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card sessions-card animate-fade-in-up">
            <div class="card-header">
                <h5 class="card-title">
                    <i class="bi bi-calendar2-week"></i>
                    Booking Sessions
                </h5>
            </div>
            <div class="card-body">
                <div id="sessionsTable">
                    <div class="table-container">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>
                                            <i class="bi bi-person me-2"></i>
                                            Student Name
                                        </th>
                                        <th>
                                            <i class="bi bi-hash me-2"></i>
                                            Session ID
                                        </th>
                                        <th>
                                            <i class="bi bi-person-badge me-2"></i>
                                            Tutor ID
                                        </th>
                                        <th>
                                            <i class="bi bi-clock me-2"></i>
                                            Time
                                        </th>
                                        <th>
                                            <i class="bi bi-check-circle me-2"></i>
                                            Status
                                        </th>
                                        <th>
                                            <i class="bi bi-gear me-2"></i>
                                            Actions
                                        </th>
                                    </tr>
                                </thead>
                                <tbody id="sessionsTableBody">
                                    <!-- Sessions will be loaded here dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <i class="bi bi-calendar-x"></i>
                        <p>No sessions found</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sessions.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <nav class="admin-sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-mortarboard-fill"></i>
            Admin Panel
        </div>
        
        <ul class="sidebar-menu">
            <li class="menu-item">
                <a href="admin-dashboard.html" class="menu-link">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-users.html" class="menu-link active">
                    <i class="bi bi-people"></i>
                    Users
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-tutors.html" class="menu-link">
                    <i class="bi bi-person-workspace"></i>
                    Tutors
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-bookings.html" class="menu-link">
                    <i class="bi bi-calendar2-check"></i>
                    Bookings
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-payments.html" class="menu-link">
                    <i class="bi bi-credit-card"></i>
                    Payments
                </a>
            </li>
            <li class="menu-item mt-auto">
                <a href="#" class="menu-link text-danger" onclick="logoutAdmin()">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">


        <!-- User Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon users">
                    <i class="bi bi-people"></i>
                </div>
                <div class="stat-value" id="totalActiveUsers">0</div>
                <div class="stat-label">Active Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon users" style="background: rgba(46, 204, 113, 0.1); color: #2ECC71;">
                    <i class="bi bi-person-plus"></i>
                </div>
                <div class="stat-value" id="newUsersToday">0</div>
                <div class="stat-label">New Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon users" style="background: rgba(231, 76, 60, 0.1); color: #E74C3C;">
                    <i class="bi bi-person-x"></i>
                </div>
                <div class="stat-value" id="inactiveUsers">0</div>
                <div class="stat-label">Inactive Users</div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="data-grid">
            <div class="grid-header">
                <h2 class="grid-title">
                    <i class="bi bi-people me-2"></i>
                    User List
                </h2>
                <div class="grid-actions">
                    <div class="input-group" style="width: 300px;">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Search users..." id="searchUsers">
                    </div>

                </div>
            </div>
            <div class="table-responsive">
                <table class="grid-table">
                    <thead>
                        <tr>
                            <th>
                                <input type="checkbox" class="form-check-input" id="selectAllUsers">
                            </th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Join Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Users will be loaded here -->
                    </tbody>
                </table>
            </div>
            <div class="grid-footer p-3">
                <nav aria-label="Users pagination">
                    <ul class="pagination justify-content-end mb-0">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" tabindex="-1">Previous</a>
                        </li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-person-plus me-2"></i>
                        Add New User
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addUserForm">
                        <div class="form-group mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="fullName" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">User Type</label>
                            <select class="form-control" name="userType" required>
                                <option value="student">Student</option>
                                <option value="parent">Parent</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addUser()">Add User</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-users.js"></script>
</body>
</html>

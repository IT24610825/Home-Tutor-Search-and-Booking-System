<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/tutor-dashboard.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Tutor Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="view-sessions.html">View Sessions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card profile-card animate-fade-in-up">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <i class="bi bi-person-circle"></i>
                            Profile
                        </h5>
                        <div class="profile-image">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <div id="profileInfo" class="profile-info"></div>
                        <button class="btn btn-primary w-100" onclick="showEditProfile()">
                            <i class="bi bi-pencil me-2"></i>Edit Profile
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card content-card animate-fade-in-up">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <i class="bi bi-mortarboard-fill"></i>
                            Your Students
                        </h5>
                        <div id="studentsList" class="student-list"></div>
                    </div>
                </div>

                <div class="card content-card mt-4 animate-fade-in-up">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <i class="bi bi-people-fill"></i>
                            Available Tutors
                        </h5>
                        <div id="tutorsList" class="tutors-list"></div>
                    </div>
                </div>

                <div class="card content-card mt-4 animate-fade-in-up">
                    <div class="card-body">
                        <h5 class="card-title mb-4">
                            <i class="bi bi-person-badge-fill"></i>
                            Tutor Profile
                        </h5>
                        <div id="tutorProfileInfo">
                            <p class="text-muted">No tutor profile found.</p>
                            <button id="addProfileBtn" class="btn btn-success w-100" onclick="showTutorProfileModal()">
                                <i class="bi bi-plus-circle me-2"></i>Add Tutor Profile
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-person-gear"></i>
                        Edit Profile
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editProfileForm">
                        <div class="mb-3">
                            <label for="editContact" class="form-label">Contact</label>
                            <input type="text" class="form-control" id="editContact" required>
                        </div>
                        <div class="mb-3">
                            <label for="editPassword" class="form-label">New Password (optional)</label>
                            <input type="password" class="form-control" id="editPassword">
                        </div>
                        <div class="mb-3" id="qualificationsField" style="display: none;">
                            <label for="editQualifications" class="form-label">Qualifications</label>
                            <input type="text" class="form-control" id="editQualifications">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="updateProfile()">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tutor Profile Modal -->
    <div class="modal fade" id="tutorProfileModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tutorProfileModalTitle">
                        <i class="bi bi-person-plus"></i>
                        Add Tutor Profile
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="tutorProfileForm">
                        <div class="mb-3">
                            <label for="tutorName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="tutorName" required>
                        </div>
                        <div class="mb-3">
                            <label for="tutorLocation" class="form-label">Location</label>
                            <input type="text" class="form-control" id="tutorLocation" required>
                        </div>
                        <div class="mb-3">
                            <label for="tutorSubjects" class="form-label">Subjects (separate with semicolons)</label>
                            <input type="text" class="form-control" id="tutorSubjects" placeholder="Math;Physics;Chemistry" required>
                        </div>
                        <div class="mb-3">
                            <label for="tutorExperience" class="form-label">Years of Experience</label>
                            <input type="number" class="form-control" id="tutorExperience" required min="0">
                        </div>
                        <div class="mb-3">
                            <label for="tutorAvailability" class="form-label">Weekly Availability</label>
                            <textarea class="form-control" id="tutorAvailability" rows="3" required
                                placeholder="Monday: 9AM-5PM&#10;Tuesday: 10AM-6PM"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="tutorSpecialization" class="form-label">Specialization</label>
                            <input type="text" class="form-control" id="tutorSpecialization" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveTutorProfile()">Save Profile</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/tutor-profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Management - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <nav class="admin-sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-mortarboard-fill"></i>
            Admin Panel
        </div>
        
        <ul class="sidebar-menu">
            <li class="menu-item">
                <a href="admin-dashboard.html" class="menu-link">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-users.html" class="menu-link">
                    <i class="bi bi-people"></i>
                    Users
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-tutors.html" class="menu-link active">
                    <i class="bi bi-person-workspace"></i>
                    Tutors
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-bookings.html" class="menu-link">
                    <i class="bi bi-calendar2-check"></i>
                    Bookings
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-payments.html" class="menu-link">
                    <i class="bi bi-credit-card"></i>
                    Payments
                </a>
            </li>

            <li class="menu-item mt-auto">
                <a href="#" class="menu-link text-danger" onclick="logoutAdmin()">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="admin-header">
            <h1 class="admin-title">Tutor Management</h1>
            <div class="d-flex gap-3">

            </div>
        </div>

        <!-- Tutor Grid -->
        <div class="tutor-grid mb-4">
            <div class="grid-header">
                <h2 class="grid-title">
                    <i class="bi bi-person-workspace me-2"></i>
                    Available Tutors
                </h2>
                <div class="grid-actions">
                    <div class="input-group" style="width: 300px;">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Search tutors..." id="searchTutors">
                    </div>
                </div>
            </div>
            <div class="row g-4 mt-2" id="tutorGrid">
                <!-- Tutors will be loaded here -->
            </div>
            <div id="tutorEmptyState" class="empty-state" style="display: none;">
                <i class="bi bi-person-x"></i>
                <p>No tutors found</p>
            </div>
        </div>
    </main>

    <!-- Add Tutor Modal -->
    <div class="modal fade" id="addTutorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-person-plus me-2"></i>
                        Add New Tutor
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addTutorForm">
                        <div class="form-group mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" name="location" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Subjects (comma-separated)</label>
                            <input type="text" class="form-control" name="subjects" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Years of Experience</label>
                            <input type="number" class="form-control" name="yearsOfExperience" required min="0">
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Availability</label>
                            <input type="text" class="form-control" name="availability" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Specialization</label>
                            <input type="text" class="form-control" name="specialization" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addTutor()">Add Tutor</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-tutors.js"></script>
</body>
</html>

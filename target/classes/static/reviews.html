<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/reviews.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="student-dashboard.html">Student Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="student-dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="reviews.html">Reviews</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="logout()">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-0">Tutor Reviews</h2>
                    <p class="text-muted mb-0">Share your learning experience</p>
                </div>
                <div class="d-flex gap-3 align-items-center">
                    <button class="btn btn-primary" onclick="showWriteReviewModal()">
                        <i class="bi bi-plus-circle me-2"></i> Write Review
                    </button>
                    <div class="filter-buttons">
                        <button class="btn btn-outline-primary active" onclick="showAllReviews()">All Reviews</button>
                        <button class="btn btn-outline-primary" onclick="showMyReviews()">My Reviews</button>
                    </div>
                </div>
            </div>

            <!-- Review Stats -->
            <div class="review-stats mb-4">
                <div class="stat-item">
                    <div class="stat-value">4.8</div>
                    <div class="stat-label">Average Rating</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">127</div>
                    <div class="stat-label">Total Reviews</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">98%</div>
                    <div class="stat-label">Positive Feedback</div>
                </div>
            </div>

            <!-- Reviews List -->
            <div id="reviewsList" class="review-cards">
                <!-- Reviews will be loaded here -->
            </div>
        </div>
    </div>
</div>

<!-- Write Review Modal -->
<div class="modal fade" id="writeReviewModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Write a Review</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="reviewForm" onsubmit="submitReview(event)">
                    <div class="mb-3">
                        <label class="form-label">Select Tutor</label>
                        <select class="form-select" id="tutorSelect" required>
                            <option value="">Choose a tutor...</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Rating</label>
                        <div class="rating">
                            <input type="radio" id="star5" name="rating" value="5" required>
                            <label for="star5">★</label>
                            <input type="radio" id="star4" name="rating" value="4">
                            <label for="star4">★</label>
                            <input type="radio" id="star3" name="rating" value="3">
                            <label for="star3">★</label>
                            <input type="radio" id="star2" name="rating" value="2">
                            <label for="star2">★</label>
                            <input type="radio" id="star1" name="rating" value="1">
                            <label for="star1">★</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="reviewComment" class="form-label">Your Review</label>
                        <textarea class="form-control" id="reviewComment" rows="4" required
                            placeholder="Write your review here..."></textarea>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="reviewAnonymous">
                        <label class="form-check-label" for="reviewAnonymous">Submit Anonymously</label>
                    </div>

                    <input type="hidden" id="reviewTutorId">
                    <input type="hidden" id="reviewBookingId">

                    <div class="text-end">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Submit Review</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Edit Review Modal -->
<div class="modal fade" id="editReviewModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Review</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editReviewForm" onsubmit="updateReview(event)">
                    <div class="mb-3">
                        <label class="form-label">Rating</label>
                        <div class="rating">
                            <input type="radio" id="editStar5" name="editRating" value="5" required>
                            <label for="editStar5">★</label>
                            <input type="radio" id="editStar4" name="editRating" value="4">
                            <label for="editStar4">★</label>
                            <input type="radio" id="editStar3" name="editRating" value="3">
                            <label for="editStar3">★</label>
                            <input type="radio" id="editStar2" name="editRating" value="2">
                            <label for="editStar2">★</label>
                            <input type="radio" id="editStar1" name="editRating" value="1">
                            <label for="editStar1">★</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="editReviewComment" class="form-label">Your Review</label>
                        <textarea class="form-control" id="editReviewComment" rows="4" required></textarea>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="editReviewAnonymous">
                        <label class="form-check-label" for="editReviewAnonymous">Submit Anonymously</label>
                    </div>

                    <input type="hidden" id="editReviewId">

                    <div class="text-end">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update Review</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/reviews.js"></script>
</body>
</html>

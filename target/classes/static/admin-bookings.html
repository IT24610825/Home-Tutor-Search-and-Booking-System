<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Management - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <nav class="admin-sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-mortarboard-fill"></i>
            Admin Panel
        </div>
        
        <ul class="sidebar-menu">
            <li class="menu-item">
                <a href="admin-dashboard.html" class="menu-link">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-users.html" class="menu-link">
                    <i class="bi bi-people"></i>
                    Users
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-tutors.html" class="menu-link">
                    <i class="bi bi-person-workspace"></i>
                    Tutors
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-bookings.html" class="menu-link active">
                    <i class="bi bi-calendar2-check"></i>
                    Bookings
                </a>
            </li>
            <li class="menu-item">
                <a href="admin-payments.html" class="menu-link">
                    <i class="bi bi-credit-card"></i>
                    Payments
                </a>
            </li>

            <li class="menu-item mt-auto">
                <a href="#" class="menu-link text-danger" onclick="logoutAdmin()">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="admin-header">
            <h1 class="admin-title">Booking Management</h1>
            <div class="d-flex gap-3">
            </div>
        </div>

        <!-- Booking Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon bookings">
                    <i class="bi bi-calendar2-check"></i>
                </div>
                <div class="stat-value" id="totalBookings">0</div>
                <div class="stat-label">Total Bookings</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bookings" style="background: rgba(46, 204, 113, 0.1); color: #2ECC71;">
                    <i class="bi bi-calendar2-check-fill"></i>
                </div>
                <div class="stat-value" id="confirmedBookings">0</div>
                <div class="stat-label">Confirmed</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bookings" style="background: rgba(241, 196, 15, 0.1); color: #F1C40F;">
                    <i class="bi bi-calendar2-plus"></i>
                </div>
                <div class="stat-value" id="pendingBookings">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bookings" style="background: rgba(231, 76, 60, 0.1); color: #E74C3C;">
                    <i class="bi bi-calendar2-x"></i>
                </div>
                <div class="stat-value" id="canceledBookings">0</div>
                <div class="stat-label">Canceled</div>
            </div>
        </div>

        <!-- Bookings Table -->
        <div class="data-grid">
            <div class="grid-header">
                <h2 class="grid-title">
                    <i class="bi bi-calendar2-week me-2"></i>
                    Booking List
                </h2>
                <div class="grid-actions">
                    <div class="input-group" style="width: 300px;">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Search bookings..." id="searchBookings">
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-filter me-2"></i>Filter
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" onclick="filterBookings('all')">All Bookings</a></li>
                            <li><a class="dropdown-item" href="#" onclick="filterBookings('confirmed')">Confirmed</a></li>
                            <li><a class="dropdown-item" href="#" onclick="filterBookings('pending')">Pending</a></li>
                            <li><a class="dropdown-item" href="#" onclick="filterBookings('canceled')">Canceled</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="table-responsive">
                <table class="grid-table">
                    <thead>
                        <tr>
                            <th>Booking ID</th>
                            <th>Student</th>
                            <th>Tutor</th>
                            <th>Date & Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <!-- Bookings will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add Booking Modal -->
    <div class="modal fade" id="addBookingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-calendar2-plus me-2"></i>
                        Add New Booking
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addBookingForm">
                        <div class="form-group mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" class="form-control" name="studentName" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Student ID</label>
                            <input type="text" class="form-control" name="studentId" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Tutor Name</label>
                            <input type="text" class="form-control" name="tutorName" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Tutor ID</label>
                            <input type="text" class="form-control" name="tutorId" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Date & Time</label>
                            <input type="datetime-local" class="form-control" name="dateTime" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addBooking()">Add Booking</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-bookings.js"></script>
</body>
</html>
